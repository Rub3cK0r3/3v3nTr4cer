# The architecture choice is docker compose because then
# improves consistency, isolation, and reproducibility.
# For running the CLI inside a container it is a bit more overhead
# but we will improve it later with aliases and so on and so forth
services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: eventdb 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d eventdb"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/Backend.Dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # This URL will be repeated all over the deploys in all 
      # of the containers, we have to improve this and test it..
      DATABASE_URL: postgresql://devuser:devpass@db:5432/eventdb
      SECRET_KEY: dev-secret-key
      INTERNAL_TOKEN: dev-internal-token
      OUTBOX_PUBLISHER_ENABLED: "true"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
